<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FlatNest · Location step preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #root { width: 100vw; display: flex; align-items: flex-start; justify-content: center; padding: 24px; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: border-box; }
  ::-webkit-scrollbar { display: none; }
  /* let FNCreateListing's inner scroll area grow to its content for the preview */
  #root .fn-no-scroll-clip { overflow: visible !important; flex: none !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="theme.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="ui-app.jsx"></script>
<script type="text/babel" src="screens-owner.jsx"></script>

<script type="text/babel">
function Preview() {
  const t = fnTheme({ dark: false });
  return (
    <div style={{
      width: 390, minHeight: 1100, background: t.surface,
      boxShadow: '0 12px 40px rgba(0,0,0,.12)', borderRadius: 24,
      overflow: 'hidden', display: 'flex', flexDirection: 'column',
      position: 'relative',
    }}>
      <FNCreateListing t={t} onBack={() => {}} initialStep={2} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Preview />);
</script>
</body>
</html>
